name: Full AI Code Review

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'
  push:
    branches: [ "main" ]

jobs:
  full-code-review:
    runs-on: ubuntu-latest
    environment: Develop
    permissions:
      contents: read
      issues: write
      
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install requests
          
      - name: Run full code review
        id: review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python .github/scripts/full_review.py
          cat /tmp/review-output.txt | base64 -w 0 > /tmp/review-output.b64
          echo "review_output=$(cat /tmp/review-output.b64)" >> $GITHUB_OUTPUT
        continue-on-error: true
        
      - name: Update Issue #2
        uses: actions/github-script@v7
        with:
          script: |
            const reviewOutput = Buffer.from(`${{ steps.review.outputs.review_output }}`, 'base64').toString();
            const issueNumber = 2;
            
            try {
              // 检查Issue是否存在
              await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              
              // 更新Issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: reviewOutput || '## No review content available\n\nPlease run the workflow again.'
              });
              
              console.log(`✅ Updated issue #${issueNumber}`);
              
            } catch (error) {
              if (error.status === 404) {
                // 创建Issue
                const newIssue = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '📊 Full Code Review Report',
                  body: reviewOutput || '## No review content available',
                  labels: ['automation', 'code-review']
                });
                console.log(`✅ Created issue #${newIssue.data.number}`);
              } else {
                console.error(`Error: ${error.message}`);
                throw error;
              }
            }