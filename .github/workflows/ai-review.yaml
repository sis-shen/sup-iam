name: AI Code Review

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

jobs:
  code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Run AI Code Review
        id: review
        run: |
          npx ai-review-pipeline --json 2>&1 | tee /tmp/review-output.txt
          echo "review_output=$(cat /tmp/review-output.txt | base64 -w 0)" >> $GITHUB_OUTPUT
        continue-on-error: true
        
      - name: Update single AI review issue
        uses: actions/github-script@v7
        with:
          script: |
            const reviewOutput = Buffer.from(`${{ steps.review.outputs.review_output }}`, 'base64').toString();
            
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]'
            });
            
            const existingIssue = issues.find(issue => 
              issue.title === 'AI Code Review Report (Latest)'
            );
            
            const issueBody = '## Latest Review Results\n' +
              '\n**Time**: ' + new Date().toLocaleString() +
              '\n**Commit**: `' + `${{ github.sha }}` + '`' +
              '\n**Message**: ' + `${{ github.event.head_commit.message }}` +
              '\n\n---\n\n### Review Output\n\n```\n' +
              reviewOutput.substring(0, 5000) +
              '\n```\n\n> [View full log](' + process.env.GITHUB_SERVER_URL + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')';
            
            if (existingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: issueBody
              });
              console.log('Updated issue #' + existingIssue.number);
            } else {
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'AI Code Review Report (Latest)',
                body: issueBody
              });
              console.log('Created issue #' + newIssue.data.number);
            }