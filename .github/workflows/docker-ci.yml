name: Docker CI

# 触发条件：当代码被推送到 main 分支时，或针对 main 分支发起 Pull Request 时[citation:2][citation:4]
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # 允许读取仓库内容，必要时可以调整权限
      packages: write # 允许推送 Docker 镜像到 GHCR，如果需要推送的话
    steps:
      # 1. 拉取你的代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 【核心】直接调用你的 Makefile 进行构建和测试
      #    这样做最灵活，你原本的 make 命令无需任何改动
      - name: Build with Makefile
        run: |
          make docker-build VERSION=${{ github.sha }}
    
      # 3. 测试镜像运行
      - name: Test Docker image
        run: |
          make docker-checkversion VERSION=${{ github.sha }}


