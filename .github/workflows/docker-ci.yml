name: Docker CI

# 触发条件：当代码被推送到 main 分支时，或针对 main 分支发起 Pull Request 时[citation:2][citation:4]
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # 允许读取仓库内容，必要时可以调整权限
      packages: write # 允许推送 Docker 镜像到 GHCR，如果需要推送的话
    steps:
      #  拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置 Go 环境
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25' 

        # 运行单元测试（带缓存和详细输出）
      - name: Run Go tests
        run: |
          make test
          go tool cover -func=coverage.out  # 显示覆盖率摘要

        # 上传测试报告（便于在GitHub Actions界面查看）
      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()  # 即使测试失败也上传
        with:
          name: test-coverage
          path: coverage.out

      #  直接调用 Makefile 进行构建和测试
      - name: Build Docker image with Makefile
        run: |
          make docker-build
    
      #  测试镜像运行
      - name: Test Docker image
        run: |
          make docker-checkversion


      #  登录到 Github
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # 自动提供，无需配置

      #  推送最终镜像
      - name: Build and push Docker image
        run: |
          make docker-push
