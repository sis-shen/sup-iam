# IAM API Server 配置文件
# 部署相关配置建议通过环境变量覆盖（如数据库密码等敏感信息）

# ========== 服务器配置 ==========
server:
  # 服务器监听地址
  host: "0.0.0.0"
  # 服务器监听端口（可通过环境变量 IAM_SERVER_PORT 覆盖）
  port: 8080
  # 运行模式: debug/release/test
  # debug模式会输出详细日志，release模式会优化性能
  mode: "debug"
  # 健康检查路径
  health_path: "/healthz"
  # 健康检查地址
  health_addr: "0.0.0.0:7070"
  # 读取超时
  read_timeout: 30s
  # 写入超时
  write_timeout: 30s
  # 空闲超时
  idle_timeout: 120s
  # 黑名单过期时间
  black_list_ttl: 1s
  # 优雅关闭超时
  grace_timeout: 10s
  # 日志是否同步写入Redis
  enable_redis_sink: false
  # 日志在Redis中的key前缀
  redis_key_prefix: "iam:log:"
  # 日志同步级别（debug/info/warn/error），为空则同步所有级别
  sink_level: "info"

# ========== JWT配置 ==========
jwt:
  # JWT签名密钥（生产环境务必修改并通过环境变量 IAM_JWT_SECRET_KEY 注入）
  secret_key: ""
  # Access Token 过期时间
  access_token_expire_time: 1h
  # Refresh Token 过期时间
  refresh_token_expire_time: 168h
  # 用户ID在Token中的键名
  user_id_key: "user_id"
  # Token提取方式
  token_lookup: "header:Authorization"
  # JWT签发者
  issuer: "iam-apiserver"
  # JWT豁免路径
  skip_paths:
    - "/health"
    - "/api/v1/auth/login"
    - "/api/v1/auth/register"

# ========== MySQL配置 ==========
mysql:
  # 数据库主机地址（可通过环境变量 IAM_MYSQL_HOST 覆盖）
  host: "mysql-dev-primary"
  # 数据库端口
  port: 3306
  # 数据库用户名（可通过环境变量 IAM_MYSQL_USERNAME 覆盖）
  username: "root"
  # 数据库密码（必须通过环境变量 IAM_MYSQL_PASSWORD 注入）
  password: ""
  # 数据库名称
  database_name: "iam"
  # 最大空闲连接数
  max_idle_conns: 10
  # 最大打开连接数
  max_open_conns: 100
  # 连接最大存活时间
  conn_max_lifetime: 1h
  # 连接最大空闲时间
  conn_max_idle_time: 30m
  # 最大重试次数
  max_retries: 3

# ========== Redis配置 ==========
redis:
  host: "redis-cluster"
  port: 6379
  addrs: []                       # 集群地址列表（优先于 host+port）
  username: "iam"
  password: ""
  database_name: 0
  health_check_interval: 5s
  enable_cluster: true
  master_name: ""
  use_ssl: false
  ssl_insecure_skip_verify: false
  pool_size: 10
  max_active_conns: 100
  min_idle_conns: 5
  max_idle_conns: 10
  conn_max_idle_time: 5m
  conn_max_lifetime: 1h
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  pool_timeout: 4s

# ========== gRPC配置 ==========
grpc:
  # gRPC服务监听地址
  host: "0.0.0.0"
  # gRPC服务监听端口（可通过环境变量 IAM_GRPC_PORT 覆盖）
  port: 8081
  # 读取超时
  read_timeout: 30s
  # 写入超时
  write_timeout: 30s
  # etcd服务发现开关
  etcd_server_discovery: false
  # etcd服务地址
  etcd_host: "etcd-dev"
  # etcd服务端口
  etcd_port: 2379
  # gRPC服务名称（开启etcd服务发现时需要配置）
  service_name: ""
  # etcd租约过期时间
  lease_ttl: 10s
  # gRPC服务注册地址（为空时自动获取本机IP+grpc端口）
  service_address: ""

# ========== 日志配置 ==========
log:
  # 日志级别: debug/info/warn/error/panic/fatal
  level: "info"
  # 日志输出格式: console/json
  format: "console"
  # 日志输出路径
  output-paths:
    - stdout
  # 错误日志输出路径
  error-output-paths:
    - stderr
  # 是否禁用 caller 信息
  disable-caller: false
  # 是否禁用堆栈跟踪
  disable-stacktrace: false
  # 是否启用颜色输出（仅 console 格式有效）
  enable-color: false
  # 是否为开发模式
  development: false
  # 日志记录器名称
  name: "iam"