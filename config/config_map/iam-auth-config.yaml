# IAM Auth Server 配置文件
# 部署相关配置建议通过环境变量覆盖

# ========== 服务器配置 ==========
server:
  # 服务器监听地址
  host: "0.0.0.0"
  # 服务器监听端口（可通过环境变量 IAM_SERVER_PORT 覆盖）
  port: 8443
  # 运行模式: debug/release/test
  # debug模式会输出详细日志，release模式会优化性能
  mode: "debug"
  # 健康检查路径
  health_path: "/healthz"
  # 健康检查地址
  health_addr: "0.0.0.0:7070"
  # 读取超时
  read_timeout: 30s
  # 写入超时
  write_timeout: 30s
  # 空闲超时
  idle_timeout: 120s
  # 优雅关闭超时
  grace_timeout: 10s
  # 日志是否同步写入Redis
  enable_redis_sink: false
  # 日志在Redis中的key前缀
  redis_key_prefix: "iam:log:"
  # 日志同步级别（debug/info/warn/error），为空则同步所有级别
  sink_level: "info"

# ========== gRPC配置 ==========
grpc:
  # gRPC服务端地址（IAM API Server 的 gRPC 地址）
  host: "iam-api-server"
  # gRPC服务端端口（可通过环境变量 IAM_GRPC_PORT 覆盖）
  port: 9090
  # 是否启用 etcd 服务发现（可通过环境变量 IAM_GRPC_ETCD_SERVER_DISCOVERY 覆盖）
  etcd_server_discovery: false
  # gRPC 服务名称（可通过环境变量 IAM_GRPC_SERVICE_NAME 覆盖）
  service_name: ""

# ========== Redis配置 ==========
redis:
  host: "redis-cluster"
  port: 6379
  addrs: []                       # 集群地址列表（优先于 host+port）
  username: "iam"
  password: ""
  database_name: 0
  health_check_interval: 5s
  enable_cluster: true
  master_name: ""
  use_ssl: false
  ssl_insecure_skip_verify: false
  pool_size: 10
  max_active_conns: 100
  min_idle_conns: 5
  max_idle_conns: 10
  conn_max_idle_time: 5m
  conn_max_lifetime: 1h
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  pool_timeout: 4s

# ========== 日志配置 ==========
log:
  # 日志级别: debug/info/warn/error/panic/fatal
  level: "debug"
  # 日志输出格式: console/json
  format: "console"
  # 日志输出路径
  output-paths:
    - stdout
  # 错误日志输出路径
  error-output-paths:
    - stderr
  # 是否禁用 caller 信息
  disable-caller: false
  # 是否禁用堆栈跟踪
  disable-stacktrace: false
  # 是否启用颜色输出（仅 console 格式有效）
  enable-color: false
  # 是否为开发模式
  development: false
  # 日志记录器名称
  name: ""

analytics:
  # 是否启用审计日志
  enabled: true
  # 工作池大小
  pool_size: 10
  # 日志记录缓冲区大小（条数）
  record_buffer_size: 1024
  # 日志刷新间隔
  flush_interval: 5s
  # 日志过期时间
  storage_expiration: 24h
  # 是否详省略细记录
  enable_detail_recording: true
  # RedisKey
  analytics_key_name: "analytics"

cache:
  # 访问平率计数器数量
  num_counters: 1000
  # 缓存最大容量
  max_cost: 1 *1024 * 1024 * 1024  # 1GB
  # Get操作缓冲区通道大小
  buffer_items: 64