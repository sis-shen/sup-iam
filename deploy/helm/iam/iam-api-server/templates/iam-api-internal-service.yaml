# 集群内 Service：HTTP 8080 / rpc 8081 / healthz 7070 不对外暴露（task.md [D10]），
# 供平滑迁移期集群内调试、auth-server 拉数据与探活使用，仅 ClusterIP。
apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Values.apiServer.name }}
  name: {{ .Values.apiServer.name }}-internal
spec:
  ports:
  {{- range .Values.apiServer.service.internal }}
  - name: {{ .name }}
    protocol: TCP
    port: {{ .port }}
    targetPort: {{ .targetPort }}
  {{- end }}
  selector:
    app: {{ .Values.apiServer.name }}
  sessionAffinity: None
  type: ClusterIP
