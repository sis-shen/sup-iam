apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Values.apiServer.name }}
  name: {{ .Values.apiServer.name }}
spec:
  ports:
  - name: https
    protocol: TCP
    {{- toYaml .Values.apiServer.service.https | nindent 4 }}
  selector:
    app: {{ .Values.apiServer.name }}
  sessionAffinity: None
  type: {{ .Values.serviceType }}
