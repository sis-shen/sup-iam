# Default values for iam.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


# image:
#   repository: nginx
#   pullPolicy: IfNotPresent
#   # Overrides the image tag whose default is the chart appVersion.
#   tag: ""

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceType: NodePort

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

apiServer:
  name: iam-api-server
  secretName: iam-api-secret
  image:
    repository: ghcr.io/sis-shen/iam-api-server
    tag: "latest"
    pullPolicy: Always
  containerPorts:
    - name: https
      containerPort: 8443
    - name: http
      containerPort: 8080
    - name: rpc
      containerPort: 8081
    - name: healthz
      containerPort: 7070
  healthz:
    port: 7070
  # 证书通过 K8s Secret 挂载（task.md [D8]，与 auth-server 共用同一 Secret）
  tls:
    secretName: iam-tls-secret
    mountPath: /etc/iam/tls
    certFile: tls.crt
    keyFile: tls.key
  service:
    # 对外只暴露 HTTPS 8443（task.md [D10]），HTTP 8080 / rpc 8081 / healthz 7070 仅集群内（internal ClusterIP）
    https:
      port: 8443
      targetPort: 8443
      nodePort: 30444 # NodePort端口
    internal:
      - name: http
        port: 8080
        targetPort: 8080
      - name: rpc
        port: 8081
        targetPort: 8081
      - name: healthz
        port: 7070
        targetPort: 7070
  livenessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  startupProbe:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  configFileName: iam-api-config
  configMapName: iam-config
