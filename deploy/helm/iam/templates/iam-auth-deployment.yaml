apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ .Values.authzServer.name }}
  name: {{ .Values.authzServer.name }}
spec:
  {{- if not .Values.autoscaling.enabled }} # 防止与HPA自动扩容冲突
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: {{ .Values.authzServer.name }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: {{ .Values.authzServer.name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - {{ .Values.authzServer.name }}
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: {{ .Values.authzServer.name }}
        command:
        - /app/iam-auth-server
        envFrom:
        - secretRef:
            name: {{ .Values.authzServer.secretName }}
        image: "{{ .Values.authzServer.image.repository }}:{{ .Values.authzServer.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.authzServer.image.pullPolicy }}
        {{- with .Values.authzServer.containerPorts }}
        ports:
          {{- toYaml . | nindent 8 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.authzServer.healthz.port }}
            scheme: HTTP
          {{- toYaml .Values.authzServer.livenessProbe | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.authzServer.healthz.port }}
            scheme: HTTP
          {{- toYaml .Values.authzServer.readinessProbe | nindent 10 }}
        startupProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.authzServer.healthz.port }}
            scheme: HTTP
          {{- toYaml .Values.authzServer.startupProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.authzServer.resources | nindent 12 }}
        volumeMounts:
        - mountPath: /app/config
          name: config-volume
          readOnly: true
          subPath: {{ .Values.authzServer.configFileName }}.yaml
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          items:
          - key: {{ .Values.authzServer.configFileName }}.yaml
            path: {{ .Values.authzServer.configFileName }}.yaml
          name: {{ .Values.authzServer.configMapName }}
        name: config-volume
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
