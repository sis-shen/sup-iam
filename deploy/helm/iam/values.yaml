# Default values for iam.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets:
  - name: ghcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

apiServer:
  name: iam-api-server
  secretName: iam-api-server-secret
  image:
    repository: ghcr.io/sis-shen/iam-api-server
    tag: "latest"
    pullPolicy: IfNotPresent
  containerPorts:
    - name: http
      containerPort: 8080
    - name: rpc
      containerPort: 8081
    - name: healthz
      containerPort: 7070
  healthz:
    port: 7070
  service:
    http:
      port: 8080
      targetPort: 8080 # Pod对外暴露的端口
    https:
      port: 8443
      targetPort: 8443
    rpc:
      port: 8081
      targetPort: 8081
  livenessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  startupProbe:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  configFileName: iam-api-config
  configMapName: iam-config

authzServer:
  name: iam-auth-server
  secretName: iam-auth-secret
  image:
    repository: ghcr.io/sis-shen/iam-auth-server
    tag: "latest"
    pullPolicy: IfNotPresent
  containerPorts:
    - name: http
      containerPort: 8080
    - name: healthz
      containerPort: 7070
  healthz:
    port: 7070
  service:
    http:
      port: 8080
      targetPort: 8080 # Pod对外暴露的端口
    https:
      port: 8443
      targetPort: 8443
  livenessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  startupProbe:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  resources:
    requests:
      cpu: "300m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  configFileName: iam-auth-config
  configMapName: iam-config

iamPump:
  name: iam-pump
  secretName: iam-pump-secret
  image:
    repository: ghcr.io/sis-shen/iam-pump
    tag: "latest"
    pullPolicy: IfNotPresent
  containerPorts:
    - name: healthz
      containerPort: 7070
  healthz:
    port: 7070
  service:
    http:
      port: 7070
      targetPort: 7070 # Pod对外暴露的端口
  livenessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  startupProbe:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
  configFileName: iam-pump-config
  configMapName: iam-config