openapi: 3.0.3
info:
  contact:
    name: supdriver
    url: https://github.com/sis-shen/sup-iam
  description: 身份与访问管理系统控制面API
  title: IAM API Control Plane
  version: 1.0.0
servers:
- description: 生产环境
  url: https://127.0.0.1:8888
- description: 开发环境
  url: http://127.0.0.1:8888
security:
- BearerAuth: []
tags:
- description: 用户认证与登录
  name: auth
- description: IAM用户管理
  name: user
- description: AccessKey/SecretKey管理
  name: secret
- description: 权限策略管理
  name: policy
- description: 策略绑定关系
  name: binding
- description: 审计日志查询
  name: audit
- description: 数据面鉴权
  name: auth-verify
- description: 调试与诊断接口
  name: Debug
paths:
  /api/v1/auth/login:
    post:
      description: 用户输入用户名 / 邮箱 / 手机号和密码登录
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          description: 登录成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 登录认证失败
      summary: 用户登录
      tags:
      - auth
  /api/v1/auth/register:
    post:
      description: 用户输入用户名、邮箱（可选）、手机号（可选）和密码注册
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
          description: 注册成功
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 参数非法
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 用户已存在
      summary: 用户注册
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: 用户从登录状态退出
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
          description: 退出成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 用户未登录
      summary: 用户退出登录
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: 利用 Token 获取用户信息
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: 获取成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
      summary: 获取用户信息
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      description: 用户使用 Refresh Token 刷新 Access Token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
          description: 刷新成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
      summary: 刷新 Token
      tags:
      - auth
  /api/v1/auth/password/change:
    post:
      description: 用户上传新的密码修改登录密码
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "200":
          description: 修改成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
      summary: 修改密码
      tags:
      - auth
  /api/v1/users:
    get:
      description: 按页查询用户列表
      parameters:
      - in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - in: query
        name: page_size
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
          description: 获取成功
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 没有 admin 权限
      summary: 获取用户列表
      tags:
      - user
    post:
      description: 管理员调用接口直接创建用户
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "200":
          description: 创建成功
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 没有 admin 权限
      summary: 创建用户
      tags:
      - user
  /api/v1/users/{id}:
    delete:
      description: 删除指定 id 的用户
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        "200":
          description: 删除成功
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 没有 admin 权限
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 用户不存在
      summary: 删除用户
      tags:
      - user
    get:
      description: 获取指定用户 id 的信息
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: 获取成功
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 没有 admin 权限
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 用户不存在
      summary: 获取指定用户信息
      tags:
      - user
    put:
      description: 更新用户的昵称、手机号、邮箱、管理员权限、是否启用等字段
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "200":
          description: 更新成功
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 没有 admin 权限
      summary: 更新用户字段
      tags:
      - user
  /api/v1/secrets/{id}:
    delete:
      description: 根据 ID 删除 Secret
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        "200":
          description: 删除成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
      summary: 删除 Secret
      tags:
      - secret
    get:
      description: 获取指定 Secret ID 的信息
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
          description: 获取成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
      summary: 获取指定 Secret 信息
      tags:
      - secret
    put:
      description: 根据 ID 更新 Secret
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSecretRequest"
        required: true
      responses:
        "200":
          description: 更新成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
      summary: 更新 Secret
      tags:
      - secret
  /api/v1/secrets:
    get:
      description: 获取指定用户的 Secret 列表（用户由 Token 确定）
      parameters:
      - in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - in: query
        name: page_size
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretListResponse"
          description: 获取成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
      summary: 获取 Secret 列表
      tags:
      - secret
    post:
      description: 为指定用户创建 Secret
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecretRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSecretResponse"
          description: 创建成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
      summary: 创建 Secret
      tags:
      - secret
  /api/v1/secrets/{id}/rotate:
    put:
      description: 轮换指定 Secret 的 SK，并刷新存活时间
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateSecretResponse"
          description: 轮换成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
      summary: 轮换 Secret
      tags:
      - secret
  /api/v1/secrets/{id}/policies:
    get:
      description: 获取指定 Secret 绑定的 Policy 列表
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      - in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - in: query
        name: page_size
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretPolicyListResponse"
          description: 获取成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
      summary: 获取 Secret 绑定的 Policy 列表
      tags:
      - secret
  /api/v1/policies/{id}:
    delete:
      description: 删除指定 ID 的 Policy
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        "200":
          description: 删除成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
      summary: 删除 Policy
      tags:
      - policy
    get:
      description: 根据 ID 获取指定 Policy 信息
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
          description: 获取成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Policy 不存在
      summary: 获取指定 Policy 信息
      tags:
      - policy
    put:
      description: 更新 Policy 的名称、描述和内容
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePolicyRequest"
        required: true
      responses:
        "200":
          description: 更新成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
      summary: 更新 Policy
      tags:
      - policy
  /api/v1/policies:
    get:
      description: 获取指定用户的 Policy 列表
      parameters:
      - in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - in: query
        name: page_size
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyListResponse"
          description: 获取成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
      summary: 获取 Policy 列表
      tags:
      - policy
    post:
      description: 根据传入参数创建 Policy
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePolicyRequest"
        required: true
      responses:
        "200":
          description: 创建成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
      summary: 创建 Policy
      tags:
      - policy
  /api/v1/policies/{id}/secrets:
    get:
      description: 获取指定 Policy 绑定的 Secret 列表
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      - in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - in: query
        name: page_size
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyBindingListResponse"
          description: 获取成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
      summary: 获取 Policy 绑定的 Secret 列表
      tags:
      - policy
  /api/v1/bindings/{id}:
    delete:
      description: 删除指定 Binding
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        "200":
          description: 删除成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
      summary: 删除 Binding
      tags:
      - binding
    get:
      description: 根据 ID 获取指定 Binding 信息
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingResponse"
          description: 获取成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
      summary: 获取指定 Binding 信息
      tags:
      - binding
  /api/v1/bindings:
    get:
      description: 获取指定用户的 Binding 列表
      parameters:
      - in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - in: query
        name: page_size
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingListResponse"
          description: 获取成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
      summary: 获取 Binding 列表
      tags:
      - binding
    post:
      description: 创建 Secret 与 Policy 的绑定关系
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBindingRequest"
        required: true
      responses:
        "200":
          description: 创建成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Token 认证失败
      summary: 创建 Binding
      tags:
      - binding
  /api/v1/audits/policies/{id}:
    get:
      description: 获取指定 ID 的 Policy Audit
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPolicyAuditResponse"
          description: 获取成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 没有 admin 权限
      summary: 获取 Policy Audit
      tags:
      - audit
  /api/v1/audits/policies:
    get:
      description: "获取 Policy Audit 列表  \n支持按 PolicyID / UserID 过滤\n"
      parameters:
      - in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - in: query
        name: page_size
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPolicyAuditListResponse"
          description: 获取成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 没有 admin 权限
      summary: 获取 Policy Audit 列表
      tags:
      - audit
  /api/v1/audits/bindings/{id}:
    get:
      description: 获取指定 ID 的 Binding Audit
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBindingAuditResponse"
          description: 获取成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 没有 admin 权限
      summary: 获取 Binding Audit
      tags:
      - audit
  /api/v1/audits/bindings:
    get:
      description: "获取 Binding Audit 列表  \n"
      parameters:
      - in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - in: query
        name: page_size
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBindingAuditListResponse"
          description: 获取成功
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 没有 admin 权限
      summary: 获取 Binding Audit 列表
      tags:
      - audit
components:
  parameters:
    PageParam:
      in: query
      name: page
      schema:
        default: 1
        minimum: 1
        type: integer
    PageSizeParam:
      in: query
      name: page_size
      schema:
        default: 20
        maximum: 100
        minimum: 1
        type: integer
    IDPathParam:
      in: path
      name: id
      required: true
      schema:
        format: int64
        type: integer
  schemas:
    LoginRequest:
      description: 用户登录请求
      example:
        password: password123
        phone: "+8613812345678"
        email: alice@example.com
        username: alice
      nullable: true
      oneOf: []
      properties:
        username:
          description: 用户名登录
          example: alice
          type: string
        phone:
          description: 手机号登录
          example: "+8613812345678"
          pattern: "^\\+?[1-9]\\d{1,14}$"
          type: string
        email:
          description: 邮箱登录
          example: alice@example.com
          format: email
          type: string
        password:
          description: 密码
          example: password123
          format: password
          type: string
          writeOnly: true
      required:
      - password
      type: object
    LoginResponse:
      description: 登录成功响应
      example:
        access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expires_in: 7200
      properties:
        access_token:
          description: 访问令牌(JWT)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          type: string
        refresh_token:
          description: 刷新令牌
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          type: string
        expires_in:
          description: 访问令牌有效期（秒）
          example: 7200
          format: int64
          type: integer
      type: object
    ErrorResponse:
      example:
        error_description: 用户名已存在
        error: invalid_request
      properties:
        error:
          example: invalid_request
          type: string
        error_description:
          example: 用户名已存在
          type: string
      type: object
    RegisterRequest:
      description: 用户注册请求
      example:
        password: password123
