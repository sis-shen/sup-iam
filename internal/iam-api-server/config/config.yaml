# IAM API Server 配置文件
# 部署相关配置建议通过环境变量覆盖（如数据库密码等敏感信息）

# ========== 服务器配置 ==========
server:
  # 服务器监听地址
  host: "0.0.0.0"
  # 服务器监听端口（可通过环境变量 IAM_SERVER_PORT 覆盖）
  port: 8888
  # 运行模式: debug/release/test
  # debug模式会输出详细日志，release模式会优化性能
  mode: "debug"
  # 读取超时时间（秒）
  read_timeout: 30
  # 写入超时时间（秒）
  write_timeout: 30

# ========== JWT配置 ==========
jwt:
  # JWT签名密钥（生产环境务必修改并通过环境变量 IAM_JWT_SECRET_KEY 注入）
  secret_key: "your-super-secret-jwt-key-change-in-production"
  # Access Token 过期时间（分钟）
  access_token_expire_time: 60
  # Refresh Token 过期时间（天）
  refresh_token_expire_time: 7

# ========== MySQL配置 ==========
mysql:
  # 数据库主机地址（可通过环境变量 IAM_MYSQL_HOST 覆盖）
  host: "127.0.0.1"
  # 数据库端口
  port: 3306
  # 数据库用户名（可通过环境变量 IAM_MYSQL_USERNAME 覆盖）
  username: "root"
  # 数据库密码（必须通过环境变量 IAM_MYSQL_PASSWORD 注入）
  password: ""
  # 数据库名称
  database_name: "iam"

# ========== Redis配置 ==========
redis:
  # Redis主机地址（可通过环境变量 IAM_REDIS_HOST 覆盖）
  host: "127.0.0.1"
  # Redis端口
  port: 6379
  # Redis密码（可通过环境变量 IAM_REDIS_PASSWORD 注入）
  password: ""
  # Redis数据库编号
  database_name: 0