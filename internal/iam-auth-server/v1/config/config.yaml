# IAM Auth Server 配置文件
# 部署相关配置建议通过环境变量覆盖

# ========== 服务器配置 ==========
server:
  # 服务器监听地址
  host: "0.0.0.0"
  # 服务器监听端口（可通过环境变量 IAM_SERVER_PORT 覆盖）
  port: 8889
  # 运行模式: debug/release/test
  # debug模式会输出详细日志，release模式会优化性能
  mode: "debug"
  # 读取超时
  read_timeout: 30s
  # 写入超时
  write_timeout: 30s
  # 空闲超时
  idle_timeout: 120s
  # 优雅关闭超时
  grace_timeout: 10s
  # 日志是否同步写入Redis
  enable_redis_sink: false
  # 日志在Redis中的key前缀
  redis_key_prefix: "iam:log:"
  # 日志同步级别（debug/info/warn/error），为空则同步所有级别
  sink_level: ""

# ========== gRPC配置 ==========
grpc:
  # gRPC服务端地址（IAM API Server 的 gRPC 地址）
  host: "127.0.0.1"
  # gRPC服务端端口（可通过环境变量 IAM_GRPC_PORT 覆盖）
  port: 9090
  # 是否启用 etcd 服务发现（可通过环境变量 IAM_GRPC_ETCD_SERVER_DISCOVERY 覆盖）
  etcd_server_discovery: false
  # gRPC 服务名称（可通过环境变量 IAM_GRPC_SERVICE_NAME 覆盖）
  service_name: ""

# ========== Redis配置 ==========
redis:
  # Redis主机地址
  host: "127.0.0.1"
  # Redis端口
  port: 6379
  # Redis密码
  password: ""
  # Redis数据库编号
  database_name: 0
  # 健康检查间隔
  health_check_interval: 10s
  # 连接池大小
  pool_size: 10
  # 最小空闲连接数
  min_idle_conns: 5
  # 最大空闲连接数
  max_idle_conns: 10
  # 连接最大空闲时间
  conn_max_idle_time: 5m
  # 连接最大存活时间
  conn_max_lifetime: 1h
  # 拨号超时
  dial_timeout: 5s
  # 读取超时
  read_timeout: 3s
  # 写入超时
  write_timeout: 3s
  # 连接池获取超时
  pool_timeout: 4s

# ========== 日志配置 ==========
log:
  # 日志级别: debug/info/warn/error/panic/fatal
  level: "info"
  # 日志输出格式: console/json
  format: "console"
  # 日志输出路径
  output-paths:
    - stdout
  # 错误日志输出路径
  error-output-paths:
    - stderr
  # 是否禁用 caller 信息
  disable-caller: false
  # 是否禁用堆栈跟踪
  disable-stacktrace: false
  # 是否启用颜色输出（仅 console 格式有效）
  enable-color: false
  # 是否为开发模式
  development: false
  # 日志记录器名称
  name: ""
