# IAM Pump 配置文件
# 默认值对应 options.NewOptions()

# ============================================================
# Pump 配置
# ============================================================
pumps:
  mongo:
    type: "mongo"
    filters:
      usernames: []               # 白名单：为空表示不限制
      skippedUsernames: []        # 黑名单：优先于白名单
    timeout: 1s                   # 单次 pump 操作超时
    omit_detail_recoding: true    # 是否省略详细记录
    meta:
      url: "mongodb://localhost:27017"
      use_ssl: true
      ssl_skip_verify: true
      ssl_allow_invalid_hosts: true
      ssl_ca_file: "/opt/ssl/certs/ca-bundle.pem"
      ssl_kem_key_file: "/opt/ssl/certs/key.pem"
      db_type: ""
      collection_name: "analytics"
      max_insert_batch_size_bytes: 5242880       # 5MB
      max_document_size_bytes: 5242880            # 5MB
      collection_cap_max_size_bytes: 5242880      # 5MB
      collection_cap_enabled: true

# ============================================================
# 全局配置
# ============================================================
leader_lease_duration: 10s        # 主节点租约时长
purge_interval: 1s                # 数据清理间隔
health_check_path: "/health"      # 健康检查路径
health_check_interval: "0.0.0.0:7070"  # 健康检查监听地址（字段名与结构体 tag 一致）
omit_detail_recoding: true        # 全局是否省略详细记录

# ============================================================
# Redis 配置
# ============================================================
redis_options:
  host: "127.0.0.1"
  port: 6379
  addrs: []                       # 集群地址列表（优先于 host+port）
  username: ""
  password: ""
  database_name: 0
  health_check_interval: 5s
  enable_cluster: false
  master_name: ""
  use_ssl: false
  ssl_insecure_skip_verify: false
  pool_size: 10
  max_active_conns: 100
  min_idle_conns: 5
  max_idle_conns: 10
  conn_max_idle_time: 5m
  conn_max_lifetime: 1h
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  pool_timeout: 4s

# ============================================================
# 日志配置
# ============================================================
log:
  output-paths:
    - "stdout"
  error-output-paths:
    - "stderr"
  level: "info"
  v: 0
  format: "console"               # console | json
  disable-caller: false
  disable-stacktrace: false
  enable-color: false
  development: false
  name: ""
